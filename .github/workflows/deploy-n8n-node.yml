name: Deploy Jarvis

on:
  push:
    branches:
      - main

  # Manual runs can deploy any branch or tag, so a change can be tried on the
  # VPS before it is merged. Defaults to main, which is what a push deploys.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: false
        default: main

# Every SSH step below repeats the same connection block. GitHub Actions has no
# YAML anchors and no step-level `with` defaults, so the repetition is the price
# of not hiding the deploy behind a composite action.
#
# Each step is a SEPARATE SSH session: nothing carries over between them, so
# every script re-enters its directory and re-derives any value it needs.

jobs:

  # ============================================================
  # TESTS
  # ============================================================

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # Check out the ref being deployed, not the one the run started from, so
      # a manual deploy of a branch tests that branch rather than main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm test` builds first, so this also proves the package compiles.
      - name: n8n node
        working-directory: n8n-node
        run: npm ci && npm test

      - name: Gateway
        working-directory: gateway
        run: npm ci && npm test

  # ============================================================
  # GATEWAY
  # ============================================================

  deploy-gateway:
    name: Deploy Gateway
    runs-on: ubuntu-latest

    # A red test never touches the box.
    needs: test

    steps:
      - name: Update source
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            cd /docker/jarvis/gateway

            REF="${{ inputs.ref || 'main' }}"

            git fetch origin --prune --tags

            # Accept a branch, a tag, or a raw commit.
            TARGET=$(git rev-parse --verify --quiet "origin/$REF" \
              || git rev-parse --verify --quiet "$REF")

            if [ -z "$TARGET" ]; then
              echo "ERROR: no such ref on origin: $REF"
              exit 1
            fi

            echo "Deploying $REF"

            git checkout --detach --quiet "$TARGET"
            git reset --hard "$TARGET"

            echo "Commit: $(git rev-parse HEAD)"

      - name: Build and start gateway
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd /docker/jarvis/gateway

            docker compose up -d --build

      - name: Container status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 5m
          script: |
            set -e
            cd /docker/jarvis/gateway

            # The compose file's own healthcheck needs a moment after a rebuild.
            sleep 15

            docker compose ps

      # Public endpoint, so this needs no SSH session - and checking it from
      # outside the box is a stronger signal than checking it from inside.
      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://jarvis.srv1918051.hstgr.cloud/health

  # ============================================================
  # N8N NODE
  # ============================================================

  deploy-n8n-node:
    name: Deploy n8n Node
    runs-on: ubuntu-latest

    # Both jobs SSH into the same VPS with password auth. Run them in sequence:
    # two runners dialling the box at once is the difference between this job
    # and the gateway one, which passed in the run where this timed out.
    needs: deploy-gateway

    env:
      N8N: n8n-z44q-n8n-1

    steps:
      - name: Update source
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e
            cd /docker/jarvis/n8n-node

            REF="${{ inputs.ref || 'main' }}"

            git fetch origin --prune --tags

            # Accept a branch, a tag, or a raw commit.
            TARGET=$(git rev-parse --verify --quiet "origin/$REF" \
              || git rev-parse --verify --quiet "$REF")

            if [ -z "$TARGET" ]; then
              echo "ERROR: no such ref on origin: $REF"
              exit 1
            fi

            echo "Deploying $REF"

            git checkout --detach --quiet "$TARGET"
            git reset --hard "$TARGET"

            echo "Commit:  $(git rev-parse HEAD)"
            echo "Version: $(grep -m1 '"version"' package.json | sed -E 's/.*"version": "([^"]+)".*/\1/')"

      - name: Build and pack
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd /docker/jarvis/n8n-node

            # Stale tarballs would make `ls -t | head -1` ambiguous in the next
            # step, which picks the package by mtime.
            rm -f n8n-nodes-*.tgz

            # npm test builds and then runs the structural checks, so a broken
            # node fails here rather than inside n8n after the restart.
            docker run --rm \
              -v "$PWD":/app \
              -w /app \
              node:22 \
              bash -c 'npm install && npm test && npm pack'

            ls -l n8n-nodes-*.tgz

      - name: Install package into n8n
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            cd /docker/jarvis/n8n-node

            PKG=$(ls -t n8n-nodes-*.tgz | head -1)

            if [ -z "$PKG" ]; then
              echo "ERROR: Build and pack produced no tarball"
              exit 1
            fi

            echo "Package: $PKG"

            docker cp "$PKG" ${{ env.N8N }}:/tmp/"$PKG"

            docker exec \
              -u node \
              -w /home/node/.n8n/nodes \
              ${{ env.N8N }} \
              npm install --save /tmp/"$PKG"

      - name: Restart n8n
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -e

            docker restart ${{ env.N8N }}

            # n8n registers community nodes at startup, so give it time to come
            # up before anything inspects the container.
            sleep 15

            STATUS=$(docker inspect -f '{{.State.Status}}' ${{ env.N8N }})
            echo "n8n status: $STATUS"

            if [ "$STATUS" != "running" ]; then
              echo "ERROR: n8n container is not running"
              docker logs --tail 50 ${{ env.N8N }}
              exit 1
            fi

      - name: Verify installed version
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 5m
          script: |
            set -e
            cd /docker/jarvis/n8n-node

            # Both sides are re-derived here: a separate SSH session cannot see
            # a variable set by an earlier step.
            #
            # There is no Node on the host - the build runs inside a container -
            # so the source version is read with grep, not `node -p`. The
            # installed version is read by the node inside the n8n container,
            # which does exist.
            SOURCE_VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "([^"]+)".*/\1/')

            if [ -z "$SOURCE_VERSION" ]; then
              echo "ERROR: Could not read the version from package.json"
              exit 1
            fi

            INSTALLED_VERSION=$(docker exec ${{ env.N8N }} \
              node -p 'require("/home/node/.n8n/nodes/node_modules/n8n-nodes-jarvis/package.json").version')

            echo "Source:    $SOURCE_VERSION"
            echo "Installed: $INSTALLED_VERSION"

            if [ "$SOURCE_VERSION" != "$INSTALLED_VERSION" ]; then
              echo "ERROR: Version mismatch. npm will not replace an installed"
              echo "package with an identical version - bump the version."
              exit 1
            fi

            echo "Version check: PASSED"

      - name: Verify registered nodes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 5m
          script: |
            set -e

            docker exec ${{ env.N8N }} node -e '
              const root = "/home/node/.n8n/nodes/node_modules/n8n-nodes-jarvis";
              const pkg = require(`${root}/package.json`);

              // Verify what n8n will actually load: every path in the n8n
              // manifest, not one hard-coded node file.
              const expected = ["jarvis", "jarvisTrigger"];

              const found = [];

              for (const rel of pkg.n8n.nodes) {
                const [Node] = Object.values(require(`${root}/${rel}`));
                const d = new Node().description;

                found.push(d.name);
                console.log(`- ${d.displayName} (${d.name})` + (d.hidden ? " [hidden/legacy]" : ""));
              }

              const missing = expected.filter(n => !found.includes(n));

              if (missing.length) {
                console.error(`ERROR: not registered: ${missing.join(", ")}`);
                process.exit(1);
              }

              // The AI Agent only gets a Human Review tool while this
              // operation value survives on the node.
              const jarvis = require(`${root}/dist/nodes/Jarvis/Jarvis.node.js`);

              const operation = new jarvis.Jarvis()
                .description.properties.find(p => p.name === "operation");

              const actions = operation?.options ?? [];

              for (const a of actions) {
                console.log(`  action: ${a.action} (${a.value})`);
              }

              if (!actions.some(o => o.value === "sendAndWait")) {
                console.error("ERROR: Jarvis lost its sendAndWait operation, so n8n will not generate its HITL tool");
                process.exit(1);
              }

              console.log("HITL tool operation: present");
            '
