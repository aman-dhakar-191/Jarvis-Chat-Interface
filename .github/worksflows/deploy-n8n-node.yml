name: Deploy to VPS

on:
  push:
    branches:
      - claude/gateway-n8n-integration-mr0o2i
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true

          script: |
            set -e

            echo "================================"
            echo " Starting deployment"
            echo "================================"

            cd /docker/jarvis/n8n-node

            echo ""
            echo "=== GIT UPDATE ==="
            git fetch origin
            git reset --hard origin/claude/gateway-n8n-integration-mr0o2i

            echo ""
            echo "=== CURRENT COMMIT ==="
            git rev-parse HEAD

            echo ""
            echo "=== BUILD ==="
            docker run --rm \
              -v "$PWD":/app \
              -w /app \
              node:22 \
              bash -c 'npm install && npm run build && npm pack'

            echo ""
            echo "=== PACKAGE ==="
            PKG=$(ls -t n8n-nodes-*.tgz | head -1)
            echo "Package: $PKG"

            echo ""
            echo "=== INSTALL INTO N8N ==="
            docker cp "$PKG" \
              n8n-z44q-n8n-1:/tmp/"$PKG"

            docker exec \
              -u node \
              -w /home/node/.n8n/nodes \
              n8n-z44q-n8n-1 \
              npm install --save /tmp/"$PKG"

            echo ""
            echo "=== RESTART N8N ==="
            docker restart n8n-z44q-n8n-1

            echo ""
            echo "=== WAITING FOR N8N ==="
            sleep 15

            echo ""
            echo "=== N8N STATUS ==="
            docker inspect -f '{{.State.Status}}' n8n-z44q-n8n-1

            echo ""
            echo "=== INSTALLED PACKAGE ==="
            docker exec n8n-z44q-n8n-1 sh -c \
              'node -p "require(\"/home/node/.n8n/nodes/node_modules/n8n-nodes-jarvis/package.json\").version"'

            echo ""
            echo "=== AVAILABLE ACTIONS ==="

            docker exec n8n-z44q-n8n-1 sh -c '
              node - <<'"'"'NODE'"'"'
              const n = require(
                "/home/node/.n8n/nodes/node_modules/n8n-nodes-jarvis/dist/nodes/Jarvis/Jarvis.node.js"
              );

              const d = new n.Jarvis().description;

              const operation = d.properties.find(
                p => p.name === "operation"
              );

              if (!operation || !operation.options) {
                console.error("No operation options found");
                process.exit(1);
              }

              console.log(`Found ${operation.options.length} action(s):`);

              for (const option of operation.options) {
                console.log(`- ${option.name}`);
              }
              NODE
            '

            echo ""
            echo "================================"
            echo " Deployment successful"
            echo "================================"
